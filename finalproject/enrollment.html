<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hummi Home Child Care - Enrollment Page</title>
    <meta name="description" content="WDD231 | Iztamaude Mera | Final Project for Hummi Business">
    <meta name="author" content="Iztamaude Mera-Lagos">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hummi Home Child Care - Program & Schedule">
    <meta property="og:description" content="Explore our daily schedule and learning activities at Hummi Home Child Care.">
    <meta property="og:image" content="https://yourdomain.com/images/hummilogo.webp">
    <meta property="og:url" content="https://yourdomain.com/program.html">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/script.mjs" type="module" defer></script>
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <a href="index.html"><img src="images/hummilogo.webp" alt="Hummi Home Child Care" width="200"
                loading="lazy"></a>
        <button id="ham-btn" class="hamburger" aria-label="Main Menu"></button>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="program.html">Program</a></li>
            <li class="current"><a href="enrollment.html">Enrollment</a></li>
        </ul>
    </nav>
    <main>
        <form id="enrollmentform" action="thankyou.html" method="get">
            <label for="fname">Child First Name:</label>
            <input type="text" id="fname" name="fname" title="First Name" autocomplete="given-name" required>

            <label for="lname">Child Last Name:</label>
            <input type="text" id="lname" name="lname" title="Last Name" autocomplete="family-name" required>

            <label for="dob">Child Date of Birth</label>
            <input type="date" id="dob" name="dob" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" title="Email" placeholder="email@example.com"
                autocomplete="email" required>

            <label for="phone">Mobile Phone Number:</label>
            <input type="tel" name="phone" id="phone" title="Mobile Phone Number" autocomplete="tel"
                placeholder="123-456-7890" required>

            <fieldset>
                <legend>Select Your Care Time:</legend>

                <label>
                    <input type="radio" name="caretime" value="fulltime" required>
                    Full-Time Care
                </label>

                <label>
                    <input type="radio" name="caretime" value="parttime">
                    Part-Time Care
                </label>
            </fieldset>

            <input type="hidden" id="timestamp" name="timestamp">

            <button type="submit">Enroll Now!</button>
        </form>

        <div class="cards">
            <h1>Care Time Information</h1>
            <section class="card">
                <h2>Full-Time Care</h2>
                <button id="openBtn1">More Info</button>
            </section>
            <section class="card">
                <h2>Part-Time Care</h2>
                <button id="openBtn2">More Info</button>
            </section>
        </div>

        <dialog id="memberModal">
            <div id="modalContent"></div>
            <button id="closeBtn">✕</button>
        </dialog>
    </main>
    <footer>
        <img src="images/hummingbird.webp" alt="hummingbird" width="20px">
        &copy;Hummi Home Child Care
        <img src="images/hummingbird.webp" alt="hummingbird" width="20px">
        <div class="social">
            <a href="https://www.facebook.com/HummiCare" target="_blank"><img src="images/facebook.svg" alt="Facebook" width="16"
                    height="16"></a>
            <a href="https://www.instagram.com/"
                target="_blank"><img src="images/instagram.svg" alt="Instagram" width="16" height="16"></a>
        </div>
    </footer>
</body>

</html>
