<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="images/cg-logo.svg" alt="Casa Grande Logo" width="48" height="48" class="logo">
        <span>Casa Grande Chamber of Commerce</span>
        <button id="ham-btn" class="hamburger" aria-label="Main Menu"></button>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li class="current"><a href="#">Home</a></li>
            <li><a href="index.html">Directory</a></li>
            <li><a href="join.html">Join</a></li>
            <li><a href="#">Discover</a></li>
        </ul>
    </nav>
    <main>
        <form action="thankyou.html" method="get">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" title="First Name" autocomplete="given-name" required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" title="Last Name" autocomplete="family-name" required>

            <label for="org-title">Organization Title:</label>
            <input type="text" id="org-title" name="org-title" 
                autocomplete="organization-title" title="Minimum 7 characters. Only letters, hyphens, and spaces allowed." required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" title="Email" placeholder="email@example.com" autocomplete="on" required>

            <label for="phone">Mobile Phone Number:</label>
            <input type="tel" name="phone" id="phone" title="Mobile Phone Number" autocomplete="tel" placeholder="123-456-7890" required>

            <label for="business">Business Name:</label>
            <input type="text" required name="business" id="business" title="business" autocomplete="organization">

            <fieldset>
                <legend>Select Your Membership Level:</legend>

                <label>
                    <input type="radio" name="membership-level" value="np" required>
                    NP Membership (non-profit, no fee)
                </label>

                <label>
                    <input type="radio" name="membership-level" value="bronze">
                    Bronze Membership
                </label>

                <label>
                    <input type="radio" name="membership-level" value="silver">
                    Silver Membership
                </label>

                <label>
                    <input type="radio" name="membership-level" value="gold">
                    Gold Membership
                </label>
            </fieldset>

            <label for="org-desc">Business/Organisztion Description:</label>
            <textarea name="description" id="org-desc" title="Business or Organization Description" 
                rows="5" placeholder="Brief description of mission and services..." required></textarea>

                <input type="hidden" id="timestamp" name="timestamp">

            <button type="submit">Join Now!</button>
        </form>
    </main>
    <footer>
        <div class="chamber-info">
            <span>Casa Grande Chamber of Commerce</span>
            <p>1234 E. Casa Grande RD.
                <br>Casa Grande, AZ 85122
                <br>info@cgchamber.org 
                <br>(520)123-4567
            </p>
        </div>
        <div class="social">
            <a href="https://facebook.com/" target="_blank"><img src="images/facebook.svg" alt="Facebook" width="16"
                    height="16"></a>
            <a href="https://www.linkedin.com/in/iztamaudemera/" target="_blank"><img src="images/linkedin.svg"
                    alt="LinkedIn" width="16" height="16"></a>
            <a href="https://www.instagram.com/izta1013?igsh=MWh3NGh6ZjNsNTdmMw%3D%3D&utm_source=qr"
                target="_blank"><img src="images/instagram.svg" alt="Instagram" width="16" height="16"></a>
        </div>
        <p>WDD231 Class Project
            <br>Iztamaude Mera-Lagos
            <br>&copy;<span id="currentyear"></span> Casa Grande Chamber of Commerce
        </p>
        <span id="lastModified"></span>
    </footer>
</body>
</html>
